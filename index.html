// Alle Denkanstöße als flache Liste (ohne Doppelte) – Ideen für die Quest
function ideaPool(source) {
  const seen = new Set(), out = [];
  for (const cat of QUEST_SOURCES[source].inspirations) {
    for (const [text, duration, setting] of cat.ideas) {
      if (seen.has(text)) continue;
      seen.add(text);
      out.push({ id: 'idea:' + text, text, duration, setting, idea: true, category: cat.name });
    }
  }
  return out;
}
const isIdeaId = id => typeof id === 'string' && id.startsWith('idea:');
const ideasEnabled = () => data.settings.questIdeas !== false;

// Eintrag zu einer ID finden: eigener Listeneintrag oder Idee
function resolveItem(source, id) {
  if (isIdeaId(id)) return ideaPool(source).find(i => i.id === id) || null;
  return data.lists[source].find(i => i.id === id) || null;
}

// Zufall, der nur vom Text abhängt: gleiche Eingabe → gleiches Ergebnis (0…1)
function seeded(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}

const isWeekend = k => [0, 6].includes(parseKey(k).getDay());
const questLogOn = (k, source) => data.questLog.filter(l => l.date === k && (!source || l.source === source));
const monthQuestCount = k => data.questLog.filter(l => l.date.slice(0, 7) === k.slice(0, 7)).length;

// Wann war ein Eintrag zuletzt dran? → { itemId: 'JJJJ-MM-TT' }
function lastDoneMap(source) {
  const m = {};
  data.questLog.forEach(l => { if (l.source === source && (!m[l.itemId] || l.date > m[l.itemId])) m[l.itemId] = l.date; });
  return m;
}
function lastDoneText(source, itemId) {
  const d = lastDoneMap(source)[itemId];
  if (!d) return 'noch nie gemacht';
  const days = Math.round((parseKey(dateKey()) - parseKey(d)) / 86400000);
  return 'zuletzt ' + (days === 0 ? 'heute' : days === 1 ? 'gestern' : `vor ${days} Tagen`);
}

// Rangfolge: am längsten nicht dran zuerst, nie gemacht ganz oben,
// Gleichstand per Tages-Zufall (stabil innerhalb eines Tages)
function rankItems(source, items, k) {
  const last = lastDoneMap(source);
  const today = parseKey(k);
  return items
    .map(it => {
      const d = last[it.id];
      const days = d ? Math.round((today - parseKey(d)) / 86400000) : 100000;
      return { it, score: days + seeded(k + it.id) * 0.99 };
    })
    .sort((a, b) => b.score - a.score)
    .map(x => x.it);
}

// Unter der Woche nur Kurzes (bzw. ohne Dauer); reicht das nicht, auch Längeres
function weekdayFilter(pool, k, need) {
  if (isWeekend(k)) return pool;
  const short = pool.filter(a => a.duration !== 'long');
  return short.length >= Math.min(2, need) ? short : pool;
}

// Wählt bis zu `count` Vorschläge aus einer Kandidatenliste
function pickFrom(source, candidates, k, count) {
  if (count <= 0) return [];
  const ranked = rankItems(source, weekdayFilter(candidates, k, count), k);
  const out = ranked.slice(0, Math.min(2, count));
  // Abwechslung: Sind die ersten beiden gleich (allein/allein), wenn möglich etwas anderes als dritten
  if (count > 2 && ranked.length > 2) {
    const s = out.map(a => a.setting);
    const want = s[0] && s[0] === s[1] ? ranked.slice(2, 6).find(a => a.setting && a.setting !== s[0]) : null;
    out.push(want || ranked[2]);
  }
  return out.slice(0, count).map(a => a.id);
}

function pickOwn(k, exclude, count) {
  return pickFrom('activities', data.lists.activities.filter(a => !exclude.includes(a.id)), k, count);
}
function pickIdeas(k, exclude, count) {
  if (!ideasEnabled()) return [];
  const own = new Set(data.lists.activities.map(a => a.text.toLowerCase()));
  const pool = ideaPool('activities').filter(i => !exclude.includes(i.id) && !own.has(i.text.toLowerCase()));
  // Ideen: Zufall steht im Vordergrund, kürzlich gemachte rutschen nach hinten
  return pickFrom('activities', pool, k, count);
}

// Wie viele eigene Einträge bzw. Ideen soll die Quest enthalten?
function questMix() {
  const own = data.lists.activities.length;
  if (!ideasEnabled()) return { own: Math.min(QUEST_SIZE, own), ideas: 0 };
  if (own >= QUEST_SIZE) return { own: QUEST_SIZE - 1, ideas: 1 };   // 2 eigene + 1 neue Idee
  return { own, ideas: QUEST_SIZE - own };                            // auffüllen mit Ideen
}

// Holt die Quest des Tages; legt sie beim ersten Öffnen an und bleibt dann gleich
function getDailyQuest(k = dateKey()) {
  const source = dailyQuestSource();
  const mix = questMix();
  if (!mix.own && !mix.ideas) return null;
  let q = data.quests.daily[k];
  let changed = false;
  if (!q || q.source !== source) { q = { source, suggestions: [], skipped: [] }; data.quests.daily[k] = q; changed = true; }
  // Nicht mehr vorhandene Einträge entfernen (gelöscht, Ideen abgeschaltet oder inzwischen in der Liste)
  const ownTexts = new Set(data.lists.activities.map(a => a.text.toLowerCase()));
  const doneIds = questLogOn(k, source).map(l => l.itemId);
  const before = q.suggestions.length;
  q.suggestions = q.suggestions.filter(id => {
    const it = resolveItem(source, id);
    if (!it) return false;
    if (isIdeaId(id) && !doneIds.includes(id) && (!ideasEnabled() || ownTexts.has(it.text.toLowerCase()))) return false;
    return true;
  });
  if (q.suggestions.length !== before) changed = true;
  // Auffüllen
  const haveOwn = q.suggestions.filter(id => !isIdeaId(id)).length;
  const haveIdeas = q.suggestions.length - haveOwn;
  const room = Math.max(0, mix.own + mix.ideas - q.suggestions.length); // nie mehr als QUEST_SIZE
  const exclude = [...q.suggestions, ...q.skipped];
  const needOwn = Math.max(0, Math.min(mix.own - haveOwn, room));
  let addOwn = pickOwn(k, exclude, needOwn);
  if (addOwn.length < needOwn) addOwn = pickOwn(k, q.suggestions, needOwn);
  const needIdeas = Math.max(0, Math.min(mix.ideas - haveIdeas + (needOwn - addOwn.length), room - addOwn.length));
  const addIdeas = pickIdeas(k, exclude, needIdeas);
  if (addOwn.length || addIdeas.length) { q.suggestions.push(...addOwn, ...addIdeas); changed = true; }
  if (changed) save();
  return q.suggestions.length ? q : null;
}

// „Passt heute nicht“: offene Vorschläge gegen neue tauschen (nur für heute)
function skipDailyQuest() {
  const k = dateKey();
  const q = getDailyQuest(k);
  if (!q) return;
  const doneIds = questLogOn(k, q.source).map(l => l.itemId);
  const open = q.suggestions.filter(id => !doneIds.includes(id));
  if (!open.length) return;
  q.skipped = [...new Set([...q.skipped, ...open])];
  const keep = q.suggestions.filter(id => doneIds.includes(id));
  const needOwn = open.filter(id => !isIdeaId(id)).length;
  const needIdeas = open.length - needOwn;
  let own = pickOwn(k, [...keep, ...q.skipped], needOwn);
  if (own.length < needOwn) { // eigene Liste einmal durch → Runde von vorn
    q.skipped = q.skipped.filter(isIdeaId);
    own = pickOwn(k, [...keep, ...open], needOwn);
  }
  const ideas = pickIdeas(k, [...keep, ...q.skipped], needIdeas + (needOwn - own.length));
  if (!own.length && !ideas.length) { toast('Mehr Ideen? Ergänze deine Liste.', false); return; }
  q.suggestions = [...keep, ...own, ...ideas];
  save(); render();
}

function toggleQuestDone(itemId) {
  const k = dateKey(), source = dailyQuestSource();
  const existing = questLogOn(k, source).find(l => l.itemId === itemId);
  if (existing) {
    data.questLog = data.questLog.filter(l => l !== existing);
    ui.ratingFor = null;
    save(); render(); toast('Zurückgenommen', false);
    return;
  }
  const item = resolveItem(source, itemId);
  const log = { id: uid(), source, itemId, text: item ? item.text : '', date: k, doneAt: new Date().toISOString(), rating: null };
  data.questLog.push(log);
  ui.ratingFor = log.id;
  save(); render();
}

// Idee aus der Quest in die eigene Liste übernehmen (Quest + Verlauf zeigen dann auf den neuen Eintrag)
function ideaToList(ideaId) {
  const idea = resolveItem('activities', ideaId);
  if (!idea) return;
  const it = addActivity(idea.text, idea.duration, idea.setting);
  Object.values(data.quests.daily).forEach(q => { q.suggestions = q.suggestions.map(id => (id === ideaId ? it.id : id)); });
  data.questLog.forEach(l => { if (l.itemId === ideaId) l.itemId = it.id; });
  save(); render();
  toast('In deine Liste übernommen');
}

const starIcon = (filled, size = 24) =>
  `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${ICONS.star}</svg>`;
const metaText = it => [fieldLabel('duration', it.duration), fieldLabel('setting', it.setting)].filter(Boolean).join(' · ');

// --- Quest-Karte auf „Heute“ ---
function renderQuestCard() {
  const k = dateKey();
  const source = dailyQuestSource();
  const src = QUEST_SOURCES[source];
  const label = `<div class="quest-label">${icon(src.icon, 15, 2.2)}Tages-Quest</div>`;
  const q = getDailyQuest(k);
  const hasOwn = data.lists[source].length > 0;

  if (!q) {
    return `<div class="quest">${label}
      <div class="quest-title">${esc(src.emptyTitle)}</div>
      <div class="quest-sub">Leg eine kleine Liste mit Dingen an, die dir guttun. Dann schlägt dir die App hier jeden Tag etwas daraus vor.</div>
      <button class="quest-cta" data-action="open-list">${icon('plus', 18, 2.4)}Liste anlegen</button></div>`;
  }

  const logs = questLogOn(k, source);
  const doneIds = logs.map(l => l.itemId);
  const anyDone = q.suggestions.some(id => doneIds.includes(id));
  const allDone = q.suggestions.every(id => doneIds.includes(id));
  const title = hasOwn ? src.questTitles[Math.floor(seeded('title' + k) * src.questTitles.length)] : src.emptyTitle;
  const n = monthQuestCount(k);

  const rows = q.suggestions.map(id => {
    const it = resolveItem(source, id);
    if (!it) return '';
    const log = logs.find(l => l.itemId === id);
    const meta = [it.idea ? 'Neue Idee' : '', metaText(it)].filter(Boolean).join(' · ');
    let extra = '';
    if (log && ui.ratingFor === log.id && !log.rating) {
      extra = `<div class="rate"><span>Wie war's?</span><span class="stars">${[1, 2, 3, 4, 5].map(v =>
        `<button class="star-btn" data-action="quest-rate" data-id="${log.id}" data-value="${v}" aria-label="${v} Sterne">${starIcon(false, 26)}</button>`).join('')}</span>
        <button class="link-btn small" data-action="quest-rate-skip">Überspringen</button></div>`;
    } else if (log && log.rating) {
      extra = `<div class="rated">${[1, 2, 3, 4, 5].map(v => `<span class="${v <= log.rating ? 'on' : ''}">${starIcon(v <= log.rating, 14)}</span>`).join('')}</div>`;
    }
    const addBtn = it.idea ? `<button class="q-add" data-action="idea-to-list" data-id="${esc(id)}" aria-label="In meine Liste">${icon('plus', 15, 2.4)}Liste</button>` : '';
    return `<div class="q-item ${log ? 'done' : ''} ${it.idea ? 'idea' : ''}">
      <div class="q-row">
        <button class="q-check" data-action="quest-done" data-id="${esc(id)}" aria-label="${log ? 'Zurücknehmen' : 'Erledigt'}">${log ? icon('check', 16, 3) : ''}</button>
        <span class="q-text"><span>${esc(it.text)}</span>${meta ? `<span class="q-meta">${esc(meta)}</span>` : ''}</span>${addBtn}
      </div>${extra}</div>`;
  }).join('');

  const canSkip = !allDone;
  return `<div class="quest">${label}
    <div class="quest-title">${esc(anyDone ? 'Schön, dass du dir Zeit dafür genommen hast' : title)}</div>
    ${anyDone ? `<div class="quest-sub">Wenn du magst, ist noch mehr drin.</div>` : !hasOwn ? `<div class="quest-sub">${esc(src.emptyText)}</div>` : ''}
    <div class="q-items">${rows}</div>
    <div class="quest-foot">
      <span>${n ? `Diesen Monat ${n} ${n === 1 ? 'Ding' : 'Dinge'} gemacht, die dir guttun` : 'Jedes Mal zählt, ganz ohne Druck.'}</span>
    </div>
    <div class="quest-actions">
      ${canSkip ? `<button class="link-btn small" data-action="quest-skip">Passt heute nicht, anderer Vorschlag</button>` : '<span></span>'}
      <button class="link-btn small" data-action="open-list">${hasOwn ? 'Liste' : 'Liste anlegen'}</button>
    </div></div>`;
}

// --- Seite „Was mir guttut“ ---
function renderGoodList() {
  const source = 'activities';
  const src = QUEST_SOURCES[source];
  const items = data.lists[source];
  const texts = new Set(items.map(i => i.text.toLowerCase()));
  let html = `<div class="intro-card">${esc(src.intro)}</div>`;

  html += secHead(src.listTitle, items.length || null, 'new-activity', null, src.color);
  html += `<div class="list">${items.length ? items.map(it => {
    const meta = metaText(it);
    return cell({ title: esc(it.text), sub: [meta, lastDoneText(source, it.id)].filter(Boolean).map(esc).join(' · '),
      acc: chevron(), action: 'edit-activity', attrs: `data-id="${it.id}"` });
  }).join('') : emptyCell('Noch leer. Leg los oder lass dich unten inspirieren.')}</div>`;

  html += `<div class="list" style="margin-top:12px">
    <div class="cell"><span class="cell-lead">${badge('sparkles', 'var(--c-quest)')}</span><span class="cell-body"><span class="cell-text">
      <span class="cell-title">Neue Ideen in der Quest</span><span class="cell-sub">Eine Idee aus den Denkanstößen pro Tag zum Ausprobieren</span></span>
      <input type="checkbox" class="switch" data-change="quest-ideas" ${ideasEnabled() ? 'checked' : ''} aria-label="Neue Ideen in der Quest"></span></div></div>`;

  const total = ideaPool(source).length;
  html += secHead('Denkanstöße', total);
  html += `<p class="group-foot" style="margin:-2px 4px 10px">Tippe eine Kategorie an und übernimm Ideen mit einem Tipp.</p>`;
  html += `<div class="chips">${src.inspirations.map(c => `
    <button type="button" class="chip ${ui.inspCat === c.name ? 'on' : ''}" style="--c:var(--c-quest)" data-action="insp-cat" data-value="${esc(c.name)}">
      ${icon(c.icon, 15, 2)}${esc(c.name)}</button>`).join('')}</div>`;
  const cat = src.inspirations.find(c => c.name === ui.inspCat);
  if (cat) {
    html += `<div class="list" style="margin-top:12px">${cat.ideas.map(([text, duration, setting], i) => {
      const has = texts.has(text.toLowerCase());
      return cell({ title: esc(text), sub: esc(metaText({ duration, setting })),
        acc: has ? `<span style="color:var(--c-quest)">${icon('check', 20, 2.4)}</span>`
                 : `<button class="sec-add" style="color:var(--c-quest)" data-action="add-idea" data-value="${esc(cat.name)}" data-idx="${i}" aria-label="Übernehmen">${icon('plus', 18, 2.4)}</button>` });
    }).join('')}</div>`;
  }
  return html;
}

// --- Eingabefenster für Aktivitäten ---
function segmented(field, current) {
  const opts = [[null, 'Offen'], ...ITEM_FIELDS[field].options];
  return `<div class="segmented">${opts.map(([v, l]) =>
    `<button type="button" class="${(current || null) === v ? 'on' : ''}" data-action="pick-seg" data-field="${field}" data-value="${v || ''}">${l}</button>`).join('')}</div>`;
}
const fieldRows = (d) => QUEST_SOURCES.activities.fields.map(f =>
  `<div class="seg-row"><span>${ITEM_FIELDS[f].label}</span>${segmented(f, d[f])}</div>`).join('');

function openActivitySheet(existing = null) {
  const src = QUEST_SOURCES.activities;
  if (existing) {
    ui.draft = { duration: existing.duration, setting: existing.setting };
    const body = `
      <div class="list"><input id="act-text" class="field" type="text" value="${esc(existing.text)}" enterkeyhint="done" autocomplete="off"></div>
      <div class="sheet-sec"><div class="list seg-list">${fieldRows(ui.draft)}</div></div>
      <p class="sheet-note">${esc(lastDoneText('activities', existing.id).replace(/^z/, 'Z').replace(/^n/, 'N'))}</p>
      <div class="sheet-sec"><div class="list">${cell({ title: 'Aktivität löschen', action: 'delete-activity', attrs: `data-id="${existing.id}"`, cls: 'destructive' })}</div></div>`;
    openSheet('Aktivität', body, () => {
      const text = $('#act-text').value.trim();
      if (!text) { shake($('#act-text').parentElement); return; }
      Object.assign(existing, { text, duration: ui.draft.duration || null, setting: ui.draft.setting || null });
      save(); closeSheet(); render(); toast('Gespeichert');
    }, { color: 'var(--c-quest)' });
    return;
  }
  ui.draft = { duration: null, setting: null, added: [], multi: true };
  const body = `
    <div class="list input-row">
      <input id="act-text" class="field" type="text" placeholder="${esc(src.placeholder)}" enterkeyhint="send" autocomplete="off">
      <button type="button" class="send-btn" style="background:var(--c-quest)" data-action="act-add" aria-label="Hinzufügen">${icon('arrowUp', 18, 2.6)}</button>
    </div>
    <p class="sheet-note">Return fügt hinzu, dann direkt die nächste Aktivität schreiben. Die Merkmale bleiben für die folgenden Einträge gewählt.</p>
    <div class="sheet-sec"><div class="list seg-list">${fieldRows(ui.draft)}</div></div>
    <div id="act-added"></div>`;
  openSheet('Was tut dir gut?', body, finishActivitySheet, { saveLabel: 'Fertig', cancel: false, color: 'var(--c-quest)' });
  focusNoScroll($('#act-text'));
}

function addActivity(text, duration, setting) {
  const it = { id: uid(), text, duration: duration || null, setting: setting || null, createdAt: new Date().toISOString() };
  data.lists.activities.push(it);
  save();
  return it;
}

function addActivityFromInput() {
  const input = $('#act-text');
  const text = input.value.trim();
  if (!text) { shake(input.parentElement); return; }
  const it = addActivity(text, ui.draft.duration, ui.draft.setting);
  ui.draft.added.push(it.id);
  input.value = '';
  renderActAdded();
  focusNoScroll(input);
}

function renderActAdded() {
  const items = ui.draft.added.map(id => data.lists.activities.find(a => a.id === id)).filter(Boolean);
  $('#act-added').innerHTML = items.length ? `<div class="sheet-sec"><div class="sheet-label">Hinzugefügt (${items.length})</div><div class="list">
    ${items.map(a => cell({ title: esc(a.text), sub: esc(metaText(a)),
      acc: `<button class="icon-btn" data-action="undo-activity" data-id="${a.id}" aria-label="Entfernen">${icon('xmark', 16, 2.4)}</button>` })).join('')}
    </div></div>` : '';
}

function finishActivitySheet() {
  const input = $('#act-text');
  if (input && input.value.trim()) addActivityFromInput();
  const n = ui.draft.added.length;
  closeSheet(); render();
  if (n) toast(`${plural(n, 'Aktivität', 'Aktivitäten')} hinzugefügt`);
}

/* =========================================================
   15. KLICKS & EINGABEN
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, day, value } = el.dataset;

  switch (action) {
    case 'tab': closeMenu(); ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'open-menu': if ($('#menu').classList.contains('open')) closeMenu(); else { $('#menu').classList.add('open'); $('#menu-backdrop').classList.add('open'); $('#more-btn').classList.add('open'); } break;
    case 'close-menu': closeMenu(); break;

    // Was mir guttut + Tages-Quest
    case 'open-list': ui.tab = 'goodlist'; render(); window.scrollTo(0, 0); break;
    case 'new-activity': openActivitySheet(); break;
    case 'edit-activity': { const a = data.lists.activities.find(x => x.id === id); if (a) openActivitySheet(a); break; }
    case 'act-add': addActivityFromInput(); break;
    case 'pick-seg':
      ui.draft[el.dataset.field] = value || null;
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      break;
    case 'undo-activity':
      data.lists.activities = data.lists.activities.filter(a => a.id !== id);
      ui.draft.added = ui.draft.added.filter(x => x !== id);
      save(); renderActAdded();
      break;
    case 'delete-activity':
      if (confirm('Diese Aktivität löschen? Bereits Erledigtes bleibt in deiner Zählung.')) {
        data.lists.activities = data.lists.activities.filter(a => a.id !== id);
        save(); closeSheet(); render();
      }
      break;
    case 'insp-cat': ui.inspCat = ui.inspCat === value ? null : value; render(); break;
    case 'add-idea': {
      const cat = QUEST_SOURCES.activities.inspirations.find(c => c.name === value);
      const idea = cat && cat.ideas[Number(el.dataset.idx)];
      if (idea) { addActivity(idea[0], idea[1], idea[2]); render(); toast(`„${truncate(idea[0], 24)}“ übernommen`); }
      break;
    }
    case 'quest-done': toggleQuestDone(id); break;
    case 'quest-rate': {
      const log = data.questLog.find(l => l.id === id);
      if (log) { log.rating = Number(value); ui.ratingFor = null; save(); render(); toast('Danke!'); }
      break;
    }
    case 'quest-rate-skip': ui.ratingFor = null; render(); break;
    case 'quest-skip': skipDailyQuest(); break;
    case 'idea-to-list': ideaToList(id); break;
    case 'cal-prev': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() - 1, 1); render(); break;
    case 'cal-next': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + 1, 1); render(); break;
    case 'select-day': ui.calSelected = day; render(); break;
    case 'goto-day': { const d = parseKey(day); ui.tab = 'calendar'; ui.calSelected = day; ui.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); window.scrollTo(0, 0); break; }
    case 'hide-hint': localStorage.setItem(HINT_KEY, '1'); render(); break;

    case 'sheet-cancel': if (sheetDismissSaves && sheetSave) sheetSave(); else closeSheet(); break;
    case 'sheet-save': if (sheetSave) sheetSave(); break;
    case 'pick-scale': {
      const v = Number(value), field = el.dataset.field;
      const newVal = el.classList.contains('on') && field !== 'mood' ? null : v;
      ui.draft[field] = newVal;
      el.parentElement.querySelectorAll('.scale-btn').forEach(b => b.classList.toggle('on', newVal !== null && b === el));
      updateSaveState();
      break;
    }

    // Done
    case 'new-done': openDoneSheet(day || dateKey()); break;
    case 'edit-done': { const d = data.dones.find(x => x.id === id); if (d) openDoneSheet(d.date, d); break; }
    case 'done-add': addDoneFromInput(); break;
    case 'pick-cat': {
      const deselect = ui.draft.category === value;
      ui.draft.category = deselect ? null : value;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !deselect && c === el));
      break;
    }
    case 'quick-done': {
      addDone(el.dataset.text, el.dataset.cat, el.dataset.goal);
      el.classList.add('on');
      break;
    }
    case 'toggle-fav': {
      const d = data.dones.find(x => x.id === id);
      if (!d) break;
      const i = data.favorites.findIndex(f => f.text === d.text);
      if (i >= 0) data.favorites.splice(i, 1);
      else data.favorites.push({ id: uid(), text: d.text, category: d.category, goalId: d.goalId });
      save(); renderAdded();
      break;
    }
    case 'undo-done':
      data.dones = data.dones.filter(x => x.id !== id);
      ui.draft.added = ui.draft.added.filter(x => x !== id);
      save(); renderAdded();
      break;
    case 'delete-done':
      if (confirm('Dieses Done löschen?')) { data.dones = data.dones.filter(x => x.id !== id); save(); closeSheet(); render(); }
      break;

    // Dankbarkeit
    case 'new-gratitude': openGratitudeSheet(day || dateKey()); break;
    case 'grat-add': addGratitudeFromInput(); break;
    case 'del-grat': data.gratitude = data.gratitude.filter(g => g.id !== id); save(); renderGratList(); break;

    // Check-in
    case 'new-checkin': openCheckinSheet(); break;
    case 'edit-checkin': { const c = data.checkins.find(x => x.id === id); if (c) openCheckinSheet(c); break; }
    case 'toggle-emotion': {
      const on = !ui.draft.emotions.has(value);
      if (on) ui.draft.emotions.add(value); else ui.draft.emotions.delete(value);
      el.classList.toggle('on', on);
      $('#emo-tabs').innerHTML = renderEmoTabs();
      $('#ci-selected').innerHTML = renderSelectedLine();
      break;
    }
    case 'emo-tab': ui.draft.emoTab = value; $('#emo-tabs').innerHTML = renderEmoTabs(); $('#ci-emotions').innerHTML = renderEmoArea(); break;
    case 'toggle-trigger': {
      const on = !ui.draft.triggers.has(value);
      if (on) ui.draft.triggers.add(value); else ui.draft.triggers.delete(value);
      el.classList.toggle('on', on);
      break;
    }
    case 'add-emotion': {
      const input = $('#ci-custom');
      if (!input.value.trim()) { focusNoScroll(input); break; }
      addCustomEmotion(input.value); input.value = '';
      refreshEmotions();
      break;
    }
    case 'delete-checkin':
      if (confirm('Diesen Check-in löschen?')) { data.checkins = data.checkins.filter(x => x.id !== id); save(); closeSheet(); render(); }
      break;

    // Tagesfazit
    case 'open-reflection': openReflectionSheet(day); break;
    case 'delete-reflection':
      if (confirm('Tagesfazit löschen?')) { delete data.reflections[day]; save(); closeSheet(); render(); }
      break;

    // Ziele
    case 'new-goal': openGoalSheet(); break;
    case 'open-goal': { const g = data.goals.find(x => x.id === id); if (g) openGoalSheet(g); break; }
    case 'delete-goal':
      if (confirm('Ziel löschen? Verknüpfte Dones bleiben erhalten.')) {
        data.goals = data.goals.filter(x => x.id !== id);
        data.dones.forEach(d => { if (d.goalId === id) d.goalId = null; });
        data.favorites.forEach(f => { if (f.goalId === id) f.goalId = null; });
        save(); closeSheet(); render();
      }
      break;

    // Kategorien
    case 'new-cat': openCategorySheet(); break;
    case 'edit-cat': { const c = data.categories.find(x => x.id === id); if (c) openCategorySheet(c); break; }
    case 'pick-cat-icon':
      ui.draft.icon = value; $('#icon-grid').innerHTML = iconGrid(); $('#cat-preview').innerHTML = catPreview(); break;
    case 'pick-cat-color':
      ui.draft.color = value;
      el.parentElement.querySelectorAll('.color-pick').forEach(c => c.classList.toggle('on', c === el));
      $('#icon-grid').innerHTML = iconGrid(); $('#cat-preview').innerHTML = catPreview();
      break;
    case 'delete-cat': {
      const c = data.categories.find(x => x.id === id);
      if (c && confirm(`Kategorie „${c.name}“ löschen?`)) {
        data.dones.forEach(d => { if (d.category === c.name) d.category = 'Sonstiges'; });
        data.favorites.forEach(f => { if (f.category === c.name) f.category = 'Sonstiges'; });
        data.categories = data.categories.filter(x => x.id !== id);
        save(); closeSheet(); render();
      }
      break;
    }

    // Mehr
    case 'del-fav': data.favorites = data.favorites.filter(f => f.id !== id); save(); render(); break;
    case 'export-md': shareFile(`wellbeing-export-${dateKey()}.md`, buildMarkdown(exportFromKey()), 'text/plain'); break;
    case 'copy-md':
      navigator.clipboard.writeText(buildMarkdown(exportFromKey())).then(() => toast('Kopiert – jetzt in die KI einfügen'), () => toast('Kopieren nicht möglich', false));
      break;
    case 'export-json': exportJson(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'lock-now': isUnlocked = false; localStorage.removeItem(LAST_ACTIVE_KEY); showLock(); break;
    case 'unlock': tryUnlock(); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const idMap = { 'done-text': () => (ui.draft.added ? addDoneFromInput() : sheetSave && sheetSave()),
    'grat-text': addGratitudeFromInput,
    'ci-custom': () => $('[data-action="add-emotion"]').click(),
    'g-title': () => focusNoScroll($('#g-desc')),
    'cat-name': () => $('#cat-name').blur(),
    'act-text': () => (ui.draft.multi ? addActivityFromInput() : sheetSave && sheetSave()) };
  if (idMap[e.target.id]) { e.preventDefault(); idMap[e.target.id](); }
  if (e.target.dataset.change === 'name') { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'name') { data.settings.name = t.value.trim(); save(); }
  if (t.dataset.change === 'quest-ideas') { data.settings.questIdeas = t.checked; save(); render(); }
  if (t.dataset.change === 'grace') { data.settings.graceMinutes = Number(t.value); save(); }
  if (t.dataset.change === 'lock') { if (t.checked) enableLock(); else disableLock(); }
  if (t.dataset.change === 'cat-visible') {
    const c = data.categories.find(x => x.id === t.dataset.id);
    if (c) { c.hidden = !t.checked; save(); render(); }
  }
  if (t.id === 'import-file' && t.files[0]) { importJson(t.files[0]); t.value = ''; }
});

/* =========================================================
   16. START
   ========================================================= */
function init() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  renderChrome();
  if (data.settings.lockEnabled) {
    if (withinGrace()) isUnlocked = true;
    else { isUnlocked = false; showLock(); tryUnlock(); }
  }
  render();
  // Großer Titel → kleine Kopfzeile beim Scrollen
  new IntersectionObserver(([en]) => $('#navbar').classList.toggle('show', !en.isIntersecting), { rootMargin: '-40px 0px 0px 0px' }).observe($('#title'));
}
init();
</script>
</body>
</html>
