<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wellbeing">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Wellbeing</title>
<style>
/* =========================================================
   1. iOS-SYSTEMFARBEN (hell + dunkel)
   ========================================================= */
:root {
  --bg: #F2F2F7;            /* systemGroupedBackground */
  --card: #FFFFFF;          /* secondarySystemGroupedBackground */
  --sheet-bg: #F2F2F7;
  --sheet-card: #FFFFFF;
  --text: #000000;
  --secondary: rgba(60,60,67,.6);
  --tertiary: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29);
  --fill: rgba(120,120,128,.12);
  --fill-strong: rgba(120,120,128,.2);
  --material: rgba(249,249,249,.82);
  --accent: #007AFF;
  --green: #34C759; --pink: #FF2D55; --orange: #FF9500; --red: #FF3B30; --indigo: #5856D6;
  /* Farben der drei Eintragsarten: bewusst neutral, keine Ampel */
  --c-done: #007AFF; --c-grat: #30B0C7; --c-feel: #AF52DE;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --sheet-bg: #1C1C1E;
    --sheet-card: #2C2C2E;
    --text: #FFFFFF;
    --secondary: rgba(235,235,245,.6);
    --tertiary: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.65);
    --fill: rgba(118,118,128,.24);
    --fill-strong: rgba(118,118,128,.36);
    --material: rgba(29,29,31,.8);
    --accent: #0A84FF;
    --green: #30D158; --pink: #FF375F; --orange: #FF9F0A; --red: #FF453A; --indigo: #5E5CE6;
    --c-done: #0A84FF; --c-grat: #40C8E0; --c-feel: #BF5AF2;
  }
}

/* =========================================================
   2. GRUNDLAYOUT & TYPOGRAFIE (SF Pro über die Systemschrift)
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-size: 17px; line-height: 1.29; letter-spacing: -.41px;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
svg.ic { display: block; flex-shrink: 0; }
main { padding: calc(env(safe-area-inset-top) + 8px) 16px calc(170px + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: .37px; margin: 36px 4px 0; }
.date-sub { color: var(--secondary); font-size: 15px; margin: 2px 4px 0; letter-spacing: -.24px; }

/* Kleine Kopfzeile, die beim Scrollen erscheint */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top) + 11px) 16px 11px; text-align: center;
  font-weight: 600; background: var(--material);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep); opacity: 0; pointer-events: none; transition: opacity .2s; }
.navbar.show { opacity: 1; }

/* =========================================================
   3. ABSCHNITTE & GRUPPIERTE LISTEN (wie Einstellungen / Health)
   ========================================================= */
.sec-head { display: flex; align-items: center; gap: 8px; margin: 28px 4px 8px; }
.sec-head h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: .38px; }
.sec-count { color: var(--secondary); font-size: 15px; font-variant-numeric: tabular-nums; }
.sec-add { margin-left: auto; width: 30px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--accent);
  display: flex; align-items: center; justify-content: center; }
.sec-add:active { background: var(--fill-strong); }
.group-label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: -.08px; margin: 26px 16px 7px; }
.group-foot { font-size: 13px; color: var(--secondary); letter-spacing: -.08px; margin: 7px 16px 0; line-height: 1.38; }

.list { background: var(--card); border-radius: 10px; overflow: hidden; }
.sheet .list { background: var(--sheet-card); }
.cell { display: flex; align-items: stretch; width: 100%; padding-left: 16px; text-align: left; min-height: 44px; position: relative; }
button.cell:active, .cell.tap:active { background: var(--fill); }
.cell-lead { display: flex; align-items: center; margin-right: 12px; }
.cell-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 11px 16px 11px 0; }
.cell:not(:last-child) .cell-body { border-bottom: .5px solid var(--sep); }
.cell-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cell-title { overflow-wrap: anywhere; }
.cell-sub { font-size: 15px; color: var(--secondary); letter-spacing: -.24px; }
.cell-acc { color: var(--tertiary); display: flex; align-items: center; gap: 8px; font-size: 17px; }
.cell-acc .val { color: var(--secondary); }
.cell.empty .cell-body { color: var(--secondary); font-size: 15px; }
.cell.action .cell-title { color: var(--accent); }
.cell.destructive .cell-title { color: var(--red); }
.emoji-lead { font-size: 26px; width: 29px; text-align: center; line-height: 1; }

/* Icon-Quadrate wie in der Einstellungen-App */
.badge { width: 29px; height: 29px; border-radius: 7px; background: var(--c, var(--accent)); color: #fff;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.badge.sm { width: 22px; height: 22px; border-radius: 6px; }

.icon-btn { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--secondary); }
.icon-btn:active { background: var(--fill); }
.icon-btn.on { color: #FF9F0A; }

.reflection-text { margin-top: 4px; font-size: 15px; color: var(--secondary); letter-spacing: -.24px; }

.hint { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 15px;
  letter-spacing: -.24px; display: flex; gap: 12px; align-items: flex-start; }
.hint .badge { margin-top: 1px; }
.hint-body { flex: 1; }
.link-btn { color: var(--accent); font-weight: 600; }

/* =========================================================
   4. EINGABEN, CHIPS, SKALEN, SCHALTER
   ========================================================= */
.field { width: 100%; font: inherit; font-size: 17px; letter-spacing: -.41px; padding: 11px 16px; border: 0; outline: none;
  background: transparent; color: var(--text); min-height: 44px; -webkit-appearance: none; appearance: none; }
textarea.field { resize: none; min-height: 96px; line-height: 1.35; }
.field::placeholder { color: var(--tertiary); }
.input-row { display: flex; align-items: center; padding-right: 6px; }
.input-row .field { flex: 1; }
.send-btn { width: 32px; height: 32px; border-radius: 16px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.send-btn:disabled { background: var(--fill-strong); }
select.inline { font: inherit; font-size: 17px; border: 0; background: transparent; color: var(--secondary); text-align: right;
  -webkit-appearance: none; appearance: none; padding: 0; max-width: 60%; outline: none; }
input[type=date].inline { font: inherit; font-size: 17px; border: 0; background: var(--fill); color: var(--text);
  border-radius: 7px; padding: 5px 10px; -webkit-appearance: none; appearance: none; min-height: 34px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  background: var(--card); font-size: 15px; letter-spacing: -.24px; border: .5px solid var(--sep); }
.sheet .chip { background: var(--sheet-card); }
.chip .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--c, var(--accent)); }
.chip .ck { display: none; }
.chip.on { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--sheet-card)); border-color: transparent;
  color: color-mix(in srgb, var(--c, var(--accent)) 82%, var(--text)); font-weight: 600; }
.chip.on .ck { display: block; }
.chip.on .dot { display: none; }
.chip:active { transform: scale(.97); }
.chip-badge { width: 20px; height: 20px; border-radius: 5px; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; }

.sheet-sec { margin: 22px 0 0; }
.sheet-label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: -.08px; margin: 0 16px 7px; }
.sheet-label .opt { text-transform: none; }
.sheet-note { font-size: 13px; color: var(--secondary); margin: 7px 16px 0; letter-spacing: -.08px; }
.emo-group { margin-bottom: 14px; }
.emo-group-name { font-size: 13px; font-weight: 600; color: var(--secondary); margin: 0 2px 7px; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale-btn { background: var(--sheet-card); border-radius: 12px; padding: 10px 0 8px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 17px; font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 .5px var(--sep); }
.scale-btn .emo { font-size: 30px; line-height: 1.1; }
.scale-btn small { font-size: 12px; color: var(--secondary); }
.scale-btn.on { background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--sheet-card)); box-shadow: inset 0 0 0 2px var(--c, var(--accent)); font-weight: 600; }
.scale-btn:active { transform: scale(.96); }

/* iOS-Schalter */
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-strong);
  position: relative; transition: background .2s; flex-shrink: 0; margin: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }

.icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px; }
.icon-pick { aspect-ratio: 1; border-radius: 12px; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--secondary); }
.icon-pick.on { background: var(--c); color: #fff; }
.color-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 14px; }
.color-pick { aspect-ratio: 1; border-radius: 50%; background: var(--c); }
.color-pick.on { box-shadow: 0 0 0 3px var(--sheet-card), 0 0 0 5px var(--c); }

.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* =========================================================
   5. SCHNELLEINTRAG & TAB-LEISTE (Material-Hintergrund)
   ========================================================= */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--material);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom); }
.quickbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 16px 6px; max-width: 680px; margin: 0 auto; }
.qbtn { height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 16px; font-weight: 600; letter-spacing: -.32px;
  background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); transition: transform .1s; }
.qbtn:active { transform: scale(.96); background: color-mix(in srgb, var(--c) 25%, transparent); }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 680px; margin: 0 auto; }
.tabbar button { height: 50px; font-size: 10px; font-weight: 500; letter-spacing: .1px; color: #999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tabbar button.active { color: var(--accent); }

/* =========================================================
   6. SHEET (Eingabefenster, fährt von unten hoch)
   ========================================================= */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 12px); bottom: 0;
  max-width: 680px; margin: 0 auto; background: var(--sheet-bg); border-radius: 12px 12px 0 0;
  transform: translateY(105%); transition: transform .38s cubic-bezier(.32,.72,0,1); z-index: 50;
  display: flex; flex-direction: column; overflow: hidden; }
.sheet:not(.open) { visibility: hidden; transition: transform .38s cubic-bezier(.32,.72,0,1), visibility 0s linear .38s; }
.sheet.open { transform: none; visibility: visible; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 6px auto 0; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px 10px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.sheet-head button { color: var(--accent); padding: 6px 0; }
#sheet-cancel { justify-self: start; }
#sheet-save { justify-self: end; font-weight: 600; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 4px 16px calc(40px + env(safe-area-inset-bottom)); flex: 1; }
.summary-card { background: var(--sheet-card); border-radius: 10px; padding: 14px 16px; font-size: 15px; letter-spacing: -.24px; }
.summary-card strong { font-size: 17px; letter-spacing: -.41px; }
.curve { display: flex; align-items: flex-end; gap: 6px; height: 76px; margin: 14px 0 8px; }
.curve span { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.curve b { width: 100%; max-width: 22px; border-radius: 6px; }
.curve small { font-size: 11px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.muted { color: var(--secondary); }

/* =========================================================
   7. KALENDER
   ========================================================= */
.cal-card { background: var(--card); border-radius: 10px; padding: 12px 10px 10px; margin-top: 20px; }
.cal-nav { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 10px; }
.cal-nav strong { font-size: 17px; font-weight: 600; }
.cal-nav .navs { display: flex; gap: 18px; color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
.cal-wd { text-align: center; font-size: 13px; color: var(--tertiary); font-weight: 600; padding-bottom: 6px; text-transform: uppercase; }
.cal-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; }
.cal-num { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.cal-cell.mood .cal-num { background: color-mix(in srgb, var(--mood) 30%, transparent); }
.cal-cell.today .cal-num { color: var(--red); font-weight: 600; }
.cal-cell.selected .cal-num { background: var(--text); color: var(--card); font-weight: 600; }
.cal-dots { display: flex; gap: 2px; height: 5px; }
.cal-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--tertiary); }
.legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--secondary); margin: 10px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; }
.day-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.pill-btn { background: var(--card); border-radius: 10px; padding: 11px; color: var(--accent); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: -.24px; }
.pill-btn:active { background: var(--fill); }

/* =========================================================
   8. SPERRBILDSCHIRM & HUD
   ========================================================= */
.lock { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 24px; }
.lock.hidden { display: none; }
.lock-icon { width: 76px; height: 76px; border-radius: 38px; background: var(--fill); color: var(--text);
  display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.lock h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .36px; }
.lock p { color: var(--secondary); margin: 6px 0 28px; }
.btn-filled { background: var(--accent); color: #fff; border-radius: 14px; padding: 15px 28px; font-weight: 600; min-width: 240px; }
.btn-filled:active { opacity: .8; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translate(-50%, -16px) scale(.96);
  background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  color: var(--text); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: -.24px;
  box-shadow: 0 4px 24px rgba(0,0,0,.14); display: flex; align-items: center; gap: 8px;
  opacity: 0; transition: all .3s cubic-bezier(.32,.72,0,1); z-index: 200; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast svg { color: var(--green); }

/* =========================================================
   9. STARTSEITE: Tageskarte mit Begrüßung, Zahlen, Woche
   ========================================================= */
.hero { margin-top: 16px; border-radius: 16px; padding: 18px 16px 14px; position: relative; overflow: hidden;
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c-done) 16%, transparent), transparent 60%),
    radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--c-feel) 14%, transparent), transparent 60%),
    radial-gradient(120% 100% at 50% 120%, color-mix(in srgb, var(--c-grat) 14%, transparent), transparent 60%),
    var(--card); }
.hero-greet { font-size: 22px; font-weight: 700; letter-spacing: .35px; }
.hero-prompt { margin-top: 4px; font-size: 15px; color: var(--secondary); letter-spacing: -.24px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { background: color-mix(in srgb, var(--card) 70%, transparent); border-radius: 12px; padding: 10px 10px 9px;
  display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 0 0 .5px var(--sep); }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--c); }
.stat b { font-size: 28px; font-weight: 700; letter-spacing: .3px; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.1; }
.stat .emo { font-size: 26px; line-height: 1.15; }
.stat small { font-size: 12px; color: var(--secondary); letter-spacing: 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 14px; gap: 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; border-radius: 10px; }
.wday:active { background: var(--fill); }
.wday small { font-size: 11px; color: var(--secondary); font-weight: 600; text-transform: uppercase; }
.wday .wdot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 17px; background: var(--fill); }
.wday.today small { color: var(--text); }
.wday.today .wdot { box-shadow: 0 0 0 2px var(--text); }
.wday .wbar { display: flex; gap: 2px; height: 4px; }
.wday .wbar i { width: 4px; height: 4px; border-radius: 50%; background: var(--c-done); }
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <div class="lock-icon" id="lock-icon"></div>
  <h2>Wellbeing</h2>
  <p>Nur für dich.</p>
  <button class="btn-filled" data-action="unlock">Mit Face ID entsperren</button>
</div>

<header class="navbar" id="navbar"></header>

<main>
  <h1 class="large-title" id="title">Heute</h1>
  <section id="view"></section>
</main>

<div class="bottom">
  <div class="quickbar" id="quickbar"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="backdrop" class="backdrop" data-action="sheet-cancel"></div>
<div id="sheet" class="sheet" aria-hidden="true">
  <div class="grabber"></div>
  <div class="sheet-head">
    <button id="sheet-cancel" data-action="sheet-cancel">Abbrechen</button>
    <h2 id="sheet-title"></h2>
    <button id="sheet-save" data-action="sheet-save">Sichern</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>
<div id="toast" class="toast"></div>

<script>
'use strict';

/* =========================================================
   1. ICONS (Linien-Icons im Stil von SF Symbols, 24×24)
   ========================================================= */
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',

/* =========================================================
   3. DATEN LADEN & SPEICHERN (nur auf diesem Gerät)
   ========================================================= */
function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }

function emptyData() {
  return {
    version: 2,
    dones: [],        // { id, text, category, date, goalId, createdAt }
    checkins: [],     // { id, ts, mood, emotions[], triggers[], note }
    gratitude: [],    // { id, text, date, createdAt }
    reflections: {},  // 'JJJJ-MM-TT' → { mood, text, sleep, energy }
    goals: [],
    favorites: [],    // { id, text, category, goalId }
    customEmotions: [],
    categories: null, // { id, name, icon, color, hidden }
    settings: { lockEnabled: false, credentialId: null, graceMinutes: 5, lastBackup: null, name: '' },
  };
}

// Bringt auch ältere Datenstände (v1) auf den aktuellen Stand
function normalize(d) {
  const base = emptyData();
  const out = Object.assign(base, d, { settings: Object.assign(base.settings, d.settings || {}) });
  if (!Array.isArray(out.gratitude)) out.gratitude = [];
  if (!Array.isArray(out.categories) || !out.categories.length) out.categories = defaultCategories();
  // v1: Dankbarkeit stand im Tagesfazit → in eigene Einträge umziehen
  for (const [k, r] of Object.entries(out.reflections || {})) {
    if (r && Array.isArray(r.gratitude)) {
      r.gratitude.forEach(t => out.gratitude.push({ id: uid(), text: t, date: k, createdAt: k + 'T20:00:00.000Z' }));
      delete r.gratitude;
    }
  }
  out.version = 2;
  return out;
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return normalize({});
  try {
    return normalize(JSON.parse(raw));
  } catch (e) {
    localStorage.setItem(STORAGE_KEY + '-defekt-' + Date.now(), raw);
    return normalize({});
  }
}

let data = loadData();
save();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { toast('Speichern fehlgeschlagen', false); }
}

const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtTime = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDayLong = k => parseKey(k).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDayShort = k => parseKey(k).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' });
const truncate = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const emotionColor = e => (EMOTION_GROUPS.find(g => g.items.includes(e)) || { color: '#8E8E93' }).color;
const goalTitle = id => (data.goals.find(g => g.id === id) || { title: '(gelöschtes Ziel)' }).title;
const daysSince = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function catInfo(name) {
  return data.categories.find(c => c.name === name) || { name, icon: 'check', color: '#8E8E93' };
}
const catBadge = name => { const c = catInfo(name); return badge(c.icon, c.color); };
const visibleCategories = () => data.categories.filter(c => !c.hidden);

const donesOn = k => data.dones.filter(d => d.date === k).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
const checkinsOn = k => data.checkins.filter(c => dateKey(new Date(c.ts)) === k).sort((a, b) => a.ts.localeCompare(b.ts));
const gratitudeOn = k => data.gratitude.filter(g => g.date === k).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
function dayMood(k) {
  const r = data.reflections[k];
  if (r && r.mood) return r.mood;
  const cs = checkinsOn(k);
  if (!cs.length) return null;
  return Math.round(cs.reduce((s, c) => s + c.mood, 0) / cs.length);
}

let toastTimer;
function toast(msg, ok = true) {
  const t = $('#toast');
  t.innerHTML = (ok ? icon('checkCircle', 18, 2.2) : '') + `<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}
function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

}
const emptyCell = text => `<div class="cell empty"><span class="cell-body">${text}</span></div>`;

// --- Heute ---
function renderToday() {
  const k = dateKey();
  let html = `<p class="date-sub">${esc(fmtDayLong(k))}</p>` + renderHero(k);
  const entries = data.dones.length + data.checkins.length;
  const lb = data.settings.lastBackup;
  if (entries >= 10 && (!lb || daysSince(lb) >= 14)) {
    html += `<div class="hint">${badge('archive', '#8E8E93')}<div class="hint-body">${lb ? `Letztes Backup vor ${daysSince(lb)} Tagen.` : 'Noch kein Backup erstellt.'}
      <button class="link-btn" data-action="export-json">Jetzt sichern</button></div></div>`;
  }
  return html + renderDay(k, true);
}

// Tageskarte: Begrüßung, Impuls, Zahlen des Tages, letzte 7 Tage
function renderHero(k) {
  const h = new Date().getHours();
  const greet = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Hallo' : h < 22 ? 'Guten Abend' : 'Gute Nacht';
  const name = (data.settings.name || '').trim();
  const dayOfYear = Math.floor((parseKey(k) - new Date(parseKey(k).getFullYear(), 0, 0)) / 86400000);
  const prompt = PROMPTS[dayOfYear % PROMPTS.length];
  const mood = dayMood(k);

  const stat = (c, ic, value, label) => `<div class="stat" style="--c:${c}"><div class="stat-top">${value}${icon(ic, 18, 2)}</div><small>${label}</small></div>`;
  const stats = stat('var(--c-done)', 'checkCircle', `<b>${donesOn(k).length}</b>`, 'Erledigt')
    + stat('var(--c-grat)', 'sparkles', `<b>${gratitudeOn(k).length}</b>`, 'Dankbar')
    + stat('var(--c-feel)', 'heart', mood ? `<span class="emo">${MOODS[mood - 1].emoji}</span>` : `<b>–</b>`, 'Stimmung');

  let week = '';
  for (let i = 6; i >= 0; i--) {
    const d = parseKey(k); d.setDate(d.getDate() - i);
    const dk = dateKey(d), m = dayMood(dk), n = donesOn(dk).length;
    week += `<button class="wday ${i === 0 ? 'today' : ''}" data-action="goto-day" data-day="${dk}">
      <small>${d.toLocaleDateString('de-DE', { weekday: 'short' }).slice(0, 2)}</small>
      <span class="wdot">${m ? MOODS[m - 1].emoji : ''}</span>
      <span class="wbar">${'<i></i>'.repeat(Math.min(n, 3))}</span></button>`;
  }
  return `<div class="hero">
    <div class="hero-greet">${greet}${name ? ', ' + esc(name) : ''}</div>
    <div class="hero-prompt">${esc(prompt)}</div>
    <div class="stats">${stats}</div>
    <div class="week">${week}</div>
  </div>`;
}

function renderDay(k, isToday) {
  const dones = donesOn(k), cis = checkinsOn(k), grats = gratitudeOn(k), r = data.reflections[k];
  let html = '';

  html += secHead('Erledigt', dones.length || null, 'new-done', k, 'var(--c-done)');
  html += `<div class="list">${dones.length ? dones.map(d => cell({
    lead: catBadge(d.category), title: esc(d.text),
    sub: esc(d.category) + (d.goalId ? ' · ' + esc(goalTitle(d.goalId)) : ''),
    acc: chevron(), action: 'edit-done', attrs: `data-id="${d.id}"`,
  })).join('') : emptyCell('Noch nichts eingetragen.')}</div>`;

  html += secHead('Dankbar für', grats.length || null, 'new-gratitude', k, 'var(--c-grat)');
  html += `<div class="list">${grats.length ? grats.map(g => cell({
    lead: badge('sparkles', GRAT_COLOR), title: esc(g.text), acc: chevron(), action: 'new-gratitude', attrs: `data-day="${k}"`,
  })).join('') : emptyCell('Wofür bist du heute dankbar?')}</div>`;

  html += secHead('Gefühle', cis.length || null, isToday ? 'new-checkin' : '', null, 'var(--c-feel)');
  html += `<div class="list">${cis.length ? cis.map(c => cell({
    lead: `<span class="emoji-lead">${MOODS[c.mood - 1].emoji}</span>`,
    title: c.emotions.length ? c.emotions.map(esc).join(', ') : `Stimmung ${c.mood} von 5`,
    sub: `${fmtTime(c.ts)} Uhr${c.triggers.length ? ' · ' + c.triggers.map(esc).join(', ') : ''}${c.note ? ' · ' + esc(truncate(c.note, 36)) : ''}`,
    acc: chevron(), action: 'edit-checkin', attrs: `data-id="${c.id}"`,
  })).join('') : emptyCell(isToday ? 'Wie fühlst du dich gerade?' : 'Kein Check-in an diesem Tag.')}</div>`;

  html += secHead('Tagesfazit');
  if (r) {
    const extras = [r.sleep ? `Schlaf ${r.sleep}/5` : '', r.energy ? `Energie ${r.energy}/5` : ''].filter(Boolean).join(' · ');
    html += `<div class="list">${cell({
      lead: `<span class="emoji-lead">${MOODS[r.mood - 1].emoji}</span>`,
      title: `Gesamtstimmung ${r.mood} von 5`,
      sub: [extras, r.text ? esc(truncate(r.text, 120)) : ''].filter(Boolean).join('<br>'),
      acc: chevron(), action: 'open-reflection', attrs: `data-day="${k}"`,
    })}</div>`;
  } else {
    html += `<div class="list">${cell({ lead: badge('moon', 'var(--indigo)'), title: 'Tagesfazit ziehen', acc: chevron(), action: 'open-reflection', attrs: `data-day="${k}"`, cls: 'action' })}</div>`;
  }
  return html;
}

// --- Kalender ---
function renderCalendar() {
  const m = ui.calMonth, year = m.getFullYear(), month = m.getMonth();
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayK = dateKey();
  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const k = `${year}-${pad(month + 1)}-${pad(d)}`;
    const mood = dayMood(k), n = donesOn(k).length;
    const cls = ['cal-cell', mood ? 'mood' : '', k === todayK ? 'today' : '', k === ui.calSelected ? 'selected' : ''].join(' ');
    cells += `<button class="${cls}" data-action="select-day" data-day="${k}" ${mood ? `style="--mood:${MOOD_COLORS[mood]}"` : ''}>
      <span class="cal-num">${d}</span><span class="cal-dots">${'<i></i>'.repeat(Math.min(n, 3))}</span></button>`;
  }
  const label = m.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  return `
    <div class="cal-card">
      <div class="cal-nav"><strong>${label}</strong>
        <span class="navs"><button data-action="cal-prev" aria-label="Vorheriger Monat">${icon('chevronLeft', 22, 2.4)}</button>
        <button data-action="cal-next" aria-label="Nächster Monat">${icon('chevron', 22, 2.4)}</button></span></div>
      <div class="cal-grid">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<div class="cal-wd">${w}</div>`).join('')}${cells}</div>
      <div class="legend">${MOODS.map(x => `<span><i style="background:${MOOD_COLORS[x.v]}"></i>${x.emoji}</span>`).join('')}<span><i style="background:var(--tertiary);width:6px;height:6px"></i>Dones</span></div>
    </div>
    <div class="sec-head" style="margin-top:24px"><h2>${esc(fmtDayLong(ui.calSelected))}</h2></div>
    <div class="day-actions">
      <button class="pill-btn" data-action="new-done" data-day="${ui.calSelected}">${icon('plus', 16, 2.4)}Done</button>
      <button class="pill-btn" data-action="new-gratitude" data-day="${ui.calSelected}">${icon('plus', 16, 2.4)}Dankbarkeit</button>
    </div>
    ${renderDay(ui.calSelected, ui.calSelected === todayK)}`;
}

// --- Lebensziele ---
function renderGoals() {
  let html = `<p class="date-sub">Was dir im Leben wichtig ist</p>`;
  if (!data.goals.length) {
    html += `<div class="list" style="margin-top:20px">${emptyCell('Noch keine Ziele. Dones kannst du später einem Ziel zuordnen.')}</div>`;
  }
  for (const [status, label] of Object.entries(GOAL_STATUS)) {
    const gs = data.goals.filter(g => g.status === status);

    html += secHead(label, gs.length);
    html += `<div class="list">${gs.map(g => {
      const n = data.dones.filter(d => d.goalId === g.id).length;
      return cell({ lead: badge('target', status === 'done' ? '#34C759' : status === 'paused' ? '#8E8E93' : '#FF3B30'),

  return html;
}

/* =========================================================
   6. SHEET-STEUERUNG (inkl. Fix gegen das Springen nach unten)
   ========================================================= */
let sheetSave = null;
let sheetDismissSaves = false;
let savedScrollY = 0;

function openSheet(title, body, onSave, { saveLabel = 'Sichern', cancel = true } = {}) {
  $('#sheet-title').textContent = title;
  $('#sheet-body').innerHTML = body;
  $('#sheet-body').scrollTop = 0;
  $('#sheet-save').textContent = saveLabel;
  $('#sheet-save').style.visibility = onSave ? 'visible' : 'hidden';
  $('#sheet-cancel').style.visibility = cancel ? 'visible' : 'hidden';
  sheetSave = onSave;
  sheetDismissSaves = !cancel; // Mehrfach-Eingabe: Wegwischen = Fertig
  // Seite im Hintergrund einfrieren, damit iOS beim Tastatur-Öffnen nichts verschiebt
  savedScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${savedScrollY}px`;
  document.body.style.width = '100%';
  $('#sheet').classList.add('open');
  $('#sheet').setAttribute('aria-hidden', 'false');
  $('#backdrop').classList.add('open');
}

function closeSheet() {
  if (document.activeElement) document.activeElement.blur();
  $('#sheet').classList.remove('open');
  $('#sheet').setAttribute('aria-hidden', 'true');
  $('#sheet').style.height = '';
  $('#sheet').style.bottom = '';
  $('#backdrop').classList.remove('open');
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  window.scrollTo(0, savedScrollY);
  sheetSave = null;
}

// Textfeld aktivieren, ohne dass Safari die Ansicht verschiebt
function focusNoScroll(el) {
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  $('#sheet-body').scrollTop = 0;
}

// Sheet an den sichtbaren Bereich über der Tastatur anpassen
function fitSheetToKeyboard() {
  const vv = window.visualViewport;
  const s = $('#sheet');
  if (!vv || !s.classList.contains('open')) return;
  const top = s.getBoundingClientRect().top + vv.offsetTop;
  s.style.bottom = 'auto';
  s.style.height = Math.max(240, vv.height + vv.offsetTop - top) + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitSheetToKeyboard);
  visualViewport.addEventListener('scroll', fitSheetToKeyboard);
}

const chip = (label, on, attrs, lead = '') =>
  `<button type="button" class="chip ${on ? 'on' : ''}" ${attrs}>${lead}<span class="ck">${icon('check', 14, 2.6)}</span>${esc(label)}</button>`;

function scaleButtons(field, current, withEmoji = false) {
  return [1, 2, 3, 4, 5].map(v => `
    <button type="button" class="scale-btn ${current === v ? 'on' : ''}" data-action="pick-scale" data-field="${field}" data-value="${v}"
      style="--c:${withEmoji ? MOOD_COLORS[v] : 'var(--accent)'}">
      ${withEmoji ? `<span class="emo">${MOODS[v - 1].emoji}</span><small>${v}</small>` : v}</button>`).join('');
}

/* =========================================================
   7. DONE – mehrere Einträge am Stück
   ========================================================= */
function quickPicks() {
  const seen = new Set(), items = [];
  for (const f of data.favorites) if (!seen.has(f.text)) { seen.add(f.text); items.push({ ...f, fav: true }); }
  const recent = [...data.dones].sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  for (const d of recent) {
    if (items.length >= 10) break;
    if (!seen.has(d.text)) { seen.add(d.text); items.push({ text: d.text, category: d.category, goalId: d.goalId || '' }); }
  }
  return items.map(it => {
    const c = catInfo(it.category);
    return `<button type="button" class="chip" style="--c:${c.color}" data-action="quick-done" data-text="${esc(it.text)}" data-cat="${esc(it.category)}" data-goal="${esc(it.goalId || '')}">
      <span class="chip-badge">${icon(c.icon, 13, 2.4)}</span><span class="ck">${icon('check', 14, 2.6)}</span>${it.fav ? '★ ' : ''}${esc(it.text)}</button>`;
  }).join('');
}

function categoryChips(selected, extraName) {
  const list = visibleCategories();
  if (extraName && !list.some(c => c.name === extraName)) list.push(catInfo(extraName));
  return list.map(c => chip(c.name, c.name === selected, `data-action="pick-cat" data-value="${esc(c.name)}" style="--c:${c.color}"`,
    `<span class="dot"></span>`)).join('');
}

function goalSelect(currentId) {
  const goals = data.goals.filter(g => g.status === 'active' || g.id === currentId);
  if (!goals.length) return '';
  return `<div class="cell"><span class="cell-lead">${badge('target', '#FF3B30')}</span><span class="cell-body"><span class="cell-text"><span class="cell-title">Lebensziel</span></span>
    <select class="inline" id="done-goal"><option value="">Keins</option>${goals.map(g => `<option value="${g.id}" ${g.id === currentId ? 'selected' : ''}>${esc(g.title)}</option>`).join('')}</select></span></div>`;
}

function openDoneSheet(day, existing = null) {
  if (existing) return openDoneEdit(existing);
  ui.draft = { category: null, added: [] };
  const body = `
    <div class="list input-row">
      <input id="done-text" class="field" type="text" placeholder="Was hast du geschafft?" enterkeyhint="send" autocomplete="off">
      <button type="button" class="send-btn" data-action="done-add" aria-label="Hinzufügen">${icon('arrowUp', 18, 2.6)}</button>
    </div>
    <p class="sheet-note">Return fügt hinzu, dann direkt den nächsten Eintrag schreiben.</p>
    <div id="done-added"></div>
    ${data.dones.length || data.favorites.length ? `<div class="sheet-sec"><div class="sheet-label">Schnellwahl</div><div class="chips" id="quick-chips">${quickPicks()}</div></div>` : ''}
    <div class="sheet-sec"><div class="sheet-label">Kategorie <span class="opt">(optional)</span></div><div class="chips">${categoryChips(null)}</div></div>
    <div class="sheet-sec"><div class="list">
      <div class="cell"><span class="cell-lead">${badge('calendar', '#FF3B30')}</span><span class="cell-body"><span class="cell-text"><span class="cell-title">Datum</span></span>
        <input id="done-date" class="inline" type="date" value="${day || dateKey()}"></span></div>
      ${goalSelect(null)}
    </div></div>`;
  openSheet('Erledigt', body, finishDoneSheet, { saveLabel: 'Fertig', cancel: false });
  focusNoScroll($('#done-text'));
}

function addDone(text, category, goalId) {
  const entry = { id: uid(), text, category: category || 'Sonstiges', date: $('#done-date').value || dateKey(),
    goalId: goalId || null, createdAt: new Date().toISOString() };
  data.dones.push(entry);
  ui.draft.added.push(entry.id);
  save();
  renderAdded();
}

function addDoneFromInput() {
  const input = $('#done-text');
  const text = input.value.trim();
  if (!text) { shake(input.parentElement); return; }
  const goalEl = $('#done-goal');
  addDone(text, ui.draft.category, goalEl && goalEl.value);
  input.value = '';
  focusNoScroll(input);
}

function renderAdded() {
  const items = ui.draft.added.map(id => data.dones.find(d => d.id === id)).filter(Boolean);
  $('#done-added').innerHTML = items.length ? `<div class="sheet-sec"><div class="sheet-label">Hinzugefügt (${items.length})</div><div class="list">
    ${items.map(d => {
      const fav = data.favorites.some(f => f.text === d.text);
      return cell({ lead: catBadge(d.category), title: esc(d.text), sub: esc(d.category),
        acc: `<button class="icon-btn ${fav ? 'on' : ''}" data-action="toggle-fav" data-id="${d.id}" aria-label="Favorit">${icon('star', 20, 1.9)}</button>
              <button class="icon-btn" data-action="undo-done" data-id="${d.id}" aria-label="Entfernen">${icon('xmark', 16, 2.4)}</button>` });
    }).join('')}</div></div>` : '';
}

function finishDoneSheet() {
  const input = $('#done-text');
  if (input && input.value.trim()) addDoneFromInput();
  const n = ui.draft.added.length;
  closeSheet(); render();
  if (n) toast(`${plural(n, 'Done', 'Dones')} eingetragen`);
}

function openDoneEdit(d) {
  ui.draft = { category: d.category };
  const body = `
    <div class="list"><input id="done-text" class="field" type="text" value="${esc(d.text)}" enterkeyhint="done" autocomplete="off"></div>
    <div class="sheet-sec"><div class="sheet-label">Kategorie</div><div class="chips">${categoryChips(d.category, d.category)}</div></div>
    <div class="sheet-sec"><div class="list">
      <div class="cell"><span class="cell-lead">${badge('calendar', '#FF3B30')}</span><span class="cell-body"><span class="cell-text"><span class="cell-title">Datum</span></span>
        <input id="done-date" class="inline" type="date" value="${d.date}"></span></div>
      ${goalSelect(d.goalId)}
    </div></div>
    <div class="sheet-sec"><div class="list">${cell({ title: 'Done löschen', action: 'delete-done', attrs: `data-id="${d.id}"`, cls: 'destructive' })}</div></div>`;
  openSheet('Done bearbeiten', body, () => {
    const text = $('#done-text').value.trim();
    if (!text) { shake($('#done-text').parentElement); return; }
    const goalEl = $('#done-goal');
    Object.assign(d, { text, category: ui.draft.category || 'Sonstiges', date: $('#done-date').value || d.date, goalId: goalEl && goalEl.value ? goalEl.value : null });
    save(); closeSheet(); render(); toast('Gespeichert');
  });
}

/* =========================================================
   9. GEFÜHLS-CHECK-IN
   ========================================================= */
const allEmotions = () => EMOTION_GROUPS.flatMap(g => g.items).concat(data.customEmotions);
function frequentEmotions(n) {
  const count = {};
  data.checkins.forEach(c => c.emotions.forEach(e => { count[e] = (count[e] || 0) + 1; }));
  return Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, n).map(([e]) => e);
}
const emoChip = e => chip(e, ui.draft.emotions.has(e), `data-action="toggle-emotion" data-value="${esc(e)}" style="--c:${emotionColor(e)}"`, `<span class="dot"></span>`);
function emotionChips() {
  let h = '';
  const freq = frequentEmotions(8);
  if (freq.length) h += `<div class="emo-group"><div class="emo-group-name">Häufig</div><div class="chips">${freq.map(emoChip).join('')}</div></div>`;

  return h;
}

function exportFromKey() {
  const el = $('#export-range');

function buildMarkdown(fromKey) {
  const days = new Set();
  data.dones.forEach(d => days.add(d.date));
  data.checkins.forEach(c => days.add(dateKey(new Date(c.ts))));
  data.gratitude.forEach(g => days.add(g.date));
  Object.keys(data.reflections).forEach(k => days.add(k));
  const sorted = [...days].filter(k => !fromKey || k >= fromKey).sort();

  let md = `# Wellbeing-Tagebuch – Export\n\n`;
  md += `Exportiert am ${new Date().toLocaleString('de-DE')}. Zeitraum: ${sorted.length ? sorted[0] + ' bis ' + sorted[sorted.length - 1] : 'keine Einträge'}.\n\n`;
  md += `## Aufbau der Daten (Hinweis für die KI-Auswertung)\n\n`;
  md += `- Persönliches Wellbeing-Tagebuch einer Person, chronologisch nach Tagen.\n`;
  md += `- **Erledigt**: Done-Liste (was geschafft wurde), mit Kategorie und ggf. zugehörigem Lebensziel.\n`;
  md += `- **Gefühls-Check-ins**: mehrere Momentaufnahmen pro Tag mit Uhrzeit, Stimmung 1–5, gewählten Gefühlen, Auslösern und Notiz.\n`;
  md += `- **Dankbar für**: Dankbarkeitstagebuch, beliebig viele Einträge pro Tag.\n`;
  md += `- **Tagesfazit**: Gesamtbewertung des Tages (Stimmung 1–5), Freitext, Schlafqualität 1–5, Energie 1–5.\n`;
  md += `- Skala: 1 = sehr schlecht, 2 = schlecht, 3 = neutral, 4 = gut, 5 = sehr gut.\n\n`;
  if (data.goals.length) {
    md += `## Lebensziele\n\n`;
    data.goals.forEach(g => {
      const n = data.dones.filter(d => d.goalId === g.id && (!fromKey || d.date >= fromKey)).length;
      md += `- **${g.title}** (${g.area}, ${GOAL_STATUS[g.status]}, ${n} Dones im Zeitraum)${g.description ? ': ' + g.description : ''}\n`;
    });
    md += `\n`;
  }
  md += `## Tage\n\n`;
  for (const k of sorted) {
    md += `### ${k} (${parseKey(k).toLocaleDateString('de-DE', { weekday: 'long' })})\n\n`;
    const dones = donesOn(k);
    if (dones.length) {
      md += `**Erledigt:**\n`;
      dones.forEach(d => { md += `- ${d.text} [${d.category}]${d.goalId ? ` → Ziel: ${goalTitle(d.goalId)}` : ''}\n`; });
      md += `\n`;
    }
    const cis = checkinsOn(k);
    if (cis.length) {
      md += `**Gefühls-Check-ins:**\n`;
      cis.forEach(c => {
        md += `- ${fmtTime(c.ts)} Uhr – Stimmung ${c.mood}/5`;
        if (c.emotions.length) md += ` – Gefühle: ${c.emotions.join(', ')}`;
        if (c.triggers.length) md += ` – Auslöser: ${c.triggers.join(', ')}`;
        if (c.note) md += ` – Notiz: ${c.note.replace(/\n+/g, ' ')}`;
        md += `\n`;
      });
      md += `\n`;
    }
    const grats = gratitudeOn(k);
    if (grats.length) {
      md += `**Dankbar für:**\n`;
      grats.forEach(g => { md += `- ${g.text}\n`; });
      md += `\n`;
    }
    const r = data.reflections[k];
    if (r) {
      md += `**Tagesfazit:** Gesamtstimmung ${r.mood}/5`;
      if (r.sleep) md += `, Schlaf ${r.sleep}/5`;
      if (r.energy) md += `, Energie ${r.energy}/5`;
      md += `\n`;
      if (r.text) md += `> ${r.text.replace(/\n+/g, '\n> ')}\n`;
      md += `\n`;
    }
  }
  return md;
}

async function shareFile(filename, content, mime) {
  const file = new File([content], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

async function exportJson() {
  const ok = await shareFile(`wellbeing-backup-${dateKey()}.json`, JSON.stringify(data, null, 2), 'application/json');
  if (ok) { data.settings.lastBackup = new Date().toISOString(); save(); render(); toast('Backup erstellt'); }
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.dones) || !Array.isArray(d.checkins)) throw new Error('Kein Wellbeing-Backup');
      if (!confirm(`Backup mit ${d.dones.length + d.checkins.length} Einträgen einspielen? Die aktuellen Daten auf diesem iPhone werden ersetzt.`)) return;
      const keep = data.settings;
      data = normalize(d);
      data.settings = keep;
      save(); render(); toast('Backup eingespielt');
    } catch (e) { alert('Die Datei konnte nicht gelesen werden: ' + e.message); }
  };
  reader.readAsText(file);
}

/* =========================================================
   14. FACE ID-SPERRE (Passkey als Türsteher)
   ========================================================= */
let isUnlocked = !data.settings.lockEnabled;
let unlocking = false;
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function enableLock() {
  if (!window.PublicKeyCredential || !navigator.credentials) {
    alert('Face ID ist hier nicht verfügbar. Öffne die App über den Home-Bildschirm.');
    render(); return;
  }
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Wellbeing' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'Wellbeing', displayName: 'Wellbeing-App' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000,
    } });
    data.settings.credentialId = toB64(cred.rawId);
    data.settings.lockEnabled = true;
    isUnlocked = true;
    save(); render(); toast('Face ID-Sperre aktiv');
  } catch (e) { console.error(e); render(); toast('Einrichtung abgebrochen', false); }
}

async function verifyFaceId() {
  try {
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: fromB64(data.settings.credentialId) }],
      userVerification: 'required', timeout: 60000,
    } });
    return true;
  } catch (e) { console.error(e); return false; }
}

const showLock = () => $('#lock').classList.remove('hidden');
const hideLock = () => $('#lock').classList.add('hidden');

async function tryUnlock() {
  if (unlocking) return;
  unlocking = true;
  const ok = await verifyFaceId();
  unlocking = false;
  if (ok) { isUnlocked = true; hideLock(); render(); }
}

async function disableLock() {
  if (!(await verifyFaceId())) { render(); toast('Face ID nicht bestätigt', false); return; }
  data.settings.lockEnabled = false;
  data.settings.credentialId = null;
  isUnlocked = true;
  save(); render(); toast('Face ID-Sperre aus');
}

function withinGrace() {
  const last = Number(localStorage.getItem(LAST_ACTIVE_KEY) || 0);
  return Date.now() - last <= data.settings.graceMinutes * 60000;
}

document.addEventListener('visibilitychange', () => {
  if (!data.settings.lockEnabled) { if (document.visibilityState === 'visible' && !$('#sheet').classList.contains('open')) render(); return; }
  if (document.visibilityState === 'hidden') {
    if (isUnlocked) localStorage.setItem(LAST_ACTIVE_KEY, String(Date.now()));
    showLock();
  } else if (isUnlocked && withinGrace()) { hideLock(); }
  else { isUnlocked = false; showLock(); tryUnlock(); }
});

/* =========================================================
   15. KLICKS & EINGABEN
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, day, value } = el.dataset;

  switch (action) {
    case 'tab': ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'cal-prev': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() - 1, 1); render(); break;
    case 'cal-next': ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + 1, 1); render(); break;
    case 'select-day': ui.calSelected = day; render(); break;
    case 'goto-day': { const d = parseKey(day); ui.tab = 'calendar'; ui.calSelected = day; ui.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); window.scrollTo(0, 0); break; }
    case 'hide-hint': localStorage.setItem(HINT_KEY, '1'); render(); break;

    case 'sheet-cancel': if (sheetDismissSaves && sheetSave) sheetSave(); else closeSheet(); break;
    case 'sheet-save': if (sheetSave) sheetSave(); break;
    case 'pick-scale': {
      const v = Number(value), field = el.dataset.field;
      const newVal = el.classList.contains('on') && field !== 'mood' ? null : v;
      ui.draft[field] = newVal;
      el.parentElement.querySelectorAll('.scale-btn').forEach(b => b.classList.toggle('on', newVal !== null && b === el));
      break;
    }

    // Done
    case 'new-done': openDoneSheet(day || dateKey()); break;
    case 'edit-done': { const d = data.dones.find(x => x.id === id); if (d) openDoneSheet(d.date, d); break; }
    case 'done-add': addDoneFromInput(); break;
    case 'pick-cat': {
      const deselect = ui.draft.category === value;
      ui.draft.category = deselect ? null : value;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !deselect && c === el));
      break;
    }
    case 'quick-done': {
      addDone(el.dataset.text, el.dataset.cat, el.dataset.goal);
      el.classList.add('on');
      break;
    }
    case 'toggle-fav': {
      const d = data.dones.find(x => x.id === id);
      if (!d) break;
      const i = data.favorites.findIndex(f => f.text === d.text);
      if (i >= 0) data.favorites.splice(i, 1);
      else data.favorites.push({ id: uid(), text: d.text, category: d.category, goalId: d.goalId });
      save(); renderAdded();
      break;
    }
    case 'undo-done':
      data.dones = data.dones.filter(x => x.id !== id);
      ui.draft.added = ui.draft.added.filter(x => x !== id);
      save(); renderAdded();
      break;
    case 'delete-done':
      if (confirm('Dieses Done löschen?')) { data.dones = data.dones.filter(x => x.id !== id); save(); closeSheet(); render(); }
      break;

    // Dankbarkeit
    case 'new-gratitude': openGratitudeSheet(day || dateKey()); break;
    case 'grat-add': addGratitudeFromInput(); break;
    case 'del-grat': data.gratitude = data.gratitude.filter(g => g.id !== id); save(); renderGratList(); break;

    // Check-in
    case 'new-checkin': openCheckinSheet(); break;
    case 'edit-checkin': { const c = data.checkins.find(x => x.id === id); if (c) openCheckinSheet(c); break; }
    case 'toggle-emotion': {
      const on = !ui.draft.emotions.has(value);
      if (on) ui.draft.emotions.add(value); else ui.draft.emotions.delete(value);
      document.querySelectorAll('#ci-emotions .chip').forEach(c => { if (c.dataset.value === value) c.classList.toggle('on', on); });
      break;
    }
    case 'toggle-trigger': {
      const on = !ui.draft.triggers.has(value);
      if (on) ui.draft.triggers.add(value); else ui.draft.triggers.delete(value);
      el.classList.toggle('on', on);
      break;
    }
    case 'add-emotion': {
      const input = $('#ci-custom');
      if (!input.value.trim()) { focusNoScroll(input); break; }
      addCustomEmotion(input.value); input.value = '';
      $('#ci-emotions').innerHTML = emotionChips();
      break;
    }
    case 'delete-checkin':
      if (confirm('Diesen Check-in löschen?')) { data.checkins = data.checkins.filter(x => x.id !== id); save(); closeSheet(); render(); }
      break;

    // Tagesfazit
    case 'open-reflection': openReflectionSheet(day); break;
    case 'delete-reflection':
      if (confirm('Tagesfazit löschen?')) { delete data.reflections[day]; save(); closeSheet(); render(); }
      break;

    // Ziele
    case 'new-goal': openGoalSheet(); break;
    case 'open-goal': { const g = data.goals.find(x => x.id === id); if (g) openGoalSheet(g); break; }
    case 'delete-goal':
      if (confirm('Ziel löschen? Verknüpfte Dones bleiben erhalten.')) {
        data.goals = data.goals.filter(x => x.id !== id);
        data.dones.forEach(d => { if (d.goalId === id) d.goalId = null; });
        data.favorites.forEach(f => { if (f.goalId === id) f.goalId = null; });
        save(); closeSheet(); render();
      }
      break;

    // Kategorien
    case 'new-cat': openCategorySheet(); break;
    case 'edit-cat': { const c = data.categories.find(x => x.id === id); if (c) openCategorySheet(c); break; }
    case 'pick-cat-icon':
      ui.draft.icon = value; $('#icon-grid').innerHTML = iconGrid(); $('#cat-preview').innerHTML = catPreview(); break;
    case 'pick-cat-color':
      ui.draft.color = value;
      el.parentElement.querySelectorAll('.color-pick').forEach(c => c.classList.toggle('on', c === el));
      $('#icon-grid').innerHTML = iconGrid(); $('#cat-preview').innerHTML = catPreview();
      break;
    case 'delete-cat': {
      const c = data.categories.find(x => x.id === id);
      if (c && confirm(`Kategorie „${c.name}“ löschen?`)) {
        data.dones.forEach(d => { if (d.category === c.name) d.category = 'Sonstiges'; });
        data.favorites.forEach(f => { if (f.category === c.name) f.category = 'Sonstiges'; });
        data.categories = data.categories.filter(x => x.id !== id);
        save(); closeSheet(); render();
      }
      break;
    }

    // Mehr
    case 'del-fav': data.favorites = data.favorites.filter(f => f.id !== id); save(); render(); break;
    case 'export-md': shareFile(`wellbeing-export-${dateKey()}.md`, buildMarkdown(exportFromKey()), 'text/plain'); break;
    case 'copy-md':
      navigator.clipboard.writeText(buildMarkdown(exportFromKey())).then(() => toast('Kopiert – jetzt in die KI einfügen'), () => toast('Kopieren nicht möglich', false));
      break;
    case 'export-json': exportJson(); break;
    case 'import-json': $('#import-file').click(); break;
    case 'lock-now': isUnlocked = false; localStorage.removeItem(LAST_ACTIVE_KEY); showLock(); break;
    case 'unlock': tryUnlock(); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const idMap = { 'done-text': () => (ui.draft.added ? addDoneFromInput() : sheetSave && sheetSave()),
    'grat-text': addGratitudeFromInput,
    'ci-custom': () => $('[data-action="add-emotion"]').click(),
    'g-title': () => focusNoScroll($('#g-desc')),
    'cat-name': () => $('#cat-name').blur() };
  if (idMap[e.target.id]) { e.preventDefault(); idMap[e.target.id](); }
  if (e.target.dataset.change === 'name') { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'name') { data.settings.name = t.value.trim(); save(); }
  if (t.dataset.change === 'grace') { data.settings.graceMinutes = Number(t.value); save(); }
  if (t.dataset.change === 'lock') { if (t.checked) enableLock(); else disableLock(); }
  if (t.dataset.change === 'cat-visible') {
    const c = data.categories.find(x => x.id === t.dataset.id);
    if (c) { c.hidden = !t.checked; save(); render(); }
  }
  if (t.id === 'import-file' && t.files[0]) { importJson(t.files[0]); t.value = ''; }
});

/* =========================================================
   16. START
   ========================================================= */
function init() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  renderChrome();
  if (data.settings.lockEnabled) {
    if (withinGrace()) isUnlocked = true;
    else { isUnlocked = false; showLock(); tryUnlock(); }
  }
  render();
  // Großer Titel → kleine Kopfzeile beim Scrollen
  new IntersectionObserver(([en]) => $('#navbar').classList.toggle('show', !en.isIntersecting), { rootMargin: '-40px 0px 0px 0px' }).observe($('#title'));
}
init();
</script>
</body>
</html>
